services:
  - type: web
    name: bulk-email-sender
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SEND_DELAY_MS
        value: "60000"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
